# Commands and Apps to be executed at launch

# Gnome keyring — needed for Brave browser saved passwords
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets

# Load Lua keybind overrides (fixes Super+Q close and Super+D/Space launcher for Hyprland 0.57+)
exec-once = sleep 2 && hyprctl eval "dofile(os.getenv('HOME') .. '/.config/hypr/UserConfigs/keybinds.lua')"

