font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_audio_bell no
font_size 12.0
window_padding_width 25
include theme.conf
cursor_shape     beam
cursor_blink_interval 0.5
cursor_trail 1
#background_opacity 0.60
#hide_window_decorations yes
#confirm_os_window_close 0

# initially empty, to be configured by user and remains static
include userprefs.conf

# Note: as userprefs.conf is included at the end, settings configured in this file will override the defaults
# Animasyonlu İmleç İzi (Kitty 0.30+ gerektirir)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Şeffaflık
background_opacity 0.7
dynamic_background_opacity yes

# Pencere Kenarlıkları ve Boşluklar
window_padding_width 15
confirm_os_window_close 0
